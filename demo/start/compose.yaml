services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bingo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bingo-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "allkeys-lfr"]
    ports:
      - "6379:6379"

volumes:
  bingo-postgres-data:
